name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # VITE_* env vars are baked into the JS bundle at build time. Pulled
          # from repository secrets — when unset, the consent banner stays
          # hidden and AdSlot renders an empty space. See .env.example for the
          # full list of supported keys.
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_LANDING: ${{ secrets.VITE_ADSENSE_SLOT_LANDING }}
          VITE_ADSENSE_SLOT_SWAP: ${{ secrets.VITE_ADSENSE_SLOT_SWAP }}

      - name: Upload build artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only deploy when the Cloudflare credentials secret exists. This lets the
    # workflow stay green on a fresh repo before secrets are configured.
    environment:
      name: production
      url: https://linux-tuners.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=linux-tuners --branch=main
