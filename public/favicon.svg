<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon / app icon for linux-tuners.dev. Square mark reusing the OG image's
  slider motif (slate background, sky-blue accent knob) so it stays legible at
  16px while sharing visual language with og-image.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="linux-tuners.dev">
  <rect width="64" height="64" rx="12" fill="#0f172a"/>

  <!-- Slider track -->
  <rect x="10" y="30" width="44" height="4" rx="2" fill="#475569"/>
  <rect x="10" y="30" width="30" height="4" rx="2" fill="#0ea5e9"/>

  <!-- Knob -->
  <circle cx="40" cy="32" r="8" fill="white"/>
  <circle cx="40" cy="32" r="3" fill="#0ea5e9"/>
</svg>
