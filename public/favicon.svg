<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon / app icon for linux-tuners.dev: the tick motif of the Scale redesign
  (a short ruler with one tall verdigris tick), light on an ink square so it
  reads on light and dark browser tabs. Square, no rounded corners. Heavy
  strokes keep it legible at 16px. Rasterized by `npm run gen:icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="linux-tuners.dev">
  <rect width="64" height="64" fill="#161616"/>
  <!-- Ruler: baseline and four short ticks -->
  <rect x="6" y="44" width="52" height="4" fill="#ECECE8"/>
  <rect x="10.5" y="32" width="3" height="12" fill="#ECECE8"/>
  <rect x="20.5" y="36" width="3" height="8" fill="#ECECE8"/>
  <rect x="40.5" y="36" width="3" height="8" fill="#ECECE8"/>
  <rect x="50.5" y="32" width="3" height="12" fill="#ECECE8"/>
  <!-- The one tall tick -->
  <rect x="28" y="12" width="8" height="32" fill="#4FB8A3"/>
</svg>
