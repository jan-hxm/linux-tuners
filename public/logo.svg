  consent banner, footer attributions, embeds). Rasterized by `npm run gen:icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="linux-tuners.dev">
  <g transform="translate(8 8) scale(2.909)">
    <path d="M1 17H21" stroke="#161616" stroke-width="1.5" fill="none"/>
    <path d="M4 17V12M8 17V14M16 17V14M20 17V12" stroke="#161616" stroke-width="1.5" fill="none"/>
    <path d="M12 17V2" stroke="#1F7A6B" stroke-width="3" fill="none"/>
  </g>
  <text x="88" y="50" fill="#161616"
        font-family="'Host Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="-0.3">linux-tuners.dev</text>
</svg>
