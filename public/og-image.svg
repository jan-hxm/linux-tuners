    <path d="M12 17V2" stroke="#1F7A6B" stroke-width="3" fill="none"/>
  </g>
  <text x="146" y="100" fill="#161616" font-family="'Host Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.4">linux-tuners.dev</text>

  <!-- Headline -->
  <g fill="#161616" font-family="'Host Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="-2.5">
