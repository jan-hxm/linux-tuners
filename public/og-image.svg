<!--
  Source of the Open Graph image for linux-tuners.dev, 1200x630: paper
  background, ink text, and the tick motif as a ruler along the bottom. Large
  type and few elements so it stays readable as a thumbnail. Pages link
  og-image.png, rendered from this file by `npm run gen:icons`, because X,
  LinkedIn and Facebook don't show SVG previews.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="linux-tuners.dev | hardware-aware Linux config tuners">
  <rect width="1200" height="630" fill="#FAFAF8"/>

