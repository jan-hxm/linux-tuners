<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder Open Graph image for linux-tuners.dev. 1200x630 to match the
  Twitter/Facebook recommended aspect ratio. SVG works on most crawlers; if a
  social platform refuses to unfurl, convert to PNG and replace this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="linux-tuners.dev — hardware-aware Linux config tuners">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent stripe -->
  <rect x="80" y="170" width="6" height="350" fill="url(#accent)" rx="3"/>

  <text x="120" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="600" letter-spacing="6">LINUX-TUNERS.DEV</text>

  <text x="120" y="320" fill="white" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="700">Hardware-aware</text>
  <text x="120" y="410" fill="white" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="700">Linux config tuners</text>

  <text x="120" y="500" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="400">Drag sliders. Watch the impact. Copy the config.</text>

  <!-- Decorative slider hint, bottom right -->
  <g transform="translate(820, 540)" opacity="0.85">
    <rect x="0" y="14" width="280" height="4" rx="2" fill="#475569"/>
    <rect x="0" y="14" width="190" height="4" rx="2" fill="#0ea5e9"/>
    <circle cx="190" cy="16" r="11" fill="white"/>
  </g>
</svg>
